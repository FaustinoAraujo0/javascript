<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <style>
        div {
            background-color: rgb(12, 184, 12);
            color: white;
            width: 200px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="area">
        Interaja...
    </div>
    <script>

        var a = document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)

        function clicar() {
            
            a.innerHTML = 'Clicou!'
        }

        function entrar() {
            a.innerHTML = 'Entrou!'
        }
    </script>
</body>
</html>
